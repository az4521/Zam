[package]
name = "fastenhancer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "FastEnhancer (Ahn et al., MIT) streaming speech enhancement, hand-ported to wasm SIMD"

[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
