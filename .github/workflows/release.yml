name: Build & Release

on:
    push:
        branches: [master]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # Only proceed to a release when package.json "version" has no GitHub
    # release yet and is newer than every release that exists. Compared with
    # the published releases rather than the previous commit, so a release
    # that failed (red gate, failed build) is retried by the next push at the
    # same version; no bump needed. The build jobs below run on every master
    # push regardless.
    check:
        runs-on: ubuntu-latest
        outputs:
            release: ${{ steps.v.outputs.release }}
            version: ${{ steps.v.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - id: v
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  CURR=$(jq -r .version package.json)
                  echo "version=$CURR" >> "$GITHUB_OUTPUT"
                  # Fails the job (rather than guessing) if the API can't be read.
                  RELEASED=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
                    --json tagName --jq '.[].tagName' | sed 's/^v//')
                  LATEST=$(printf '%s\n' "$RELEASED" | sed '/^$/d' | sort -V | tail -n1)
                  if printf '%s\n' "$RELEASED" | grep -qxF "$CURR"; then
                    echo "release=false" >> "$GITHUB_OUTPUT"
                    echo "v$CURR is already released, skipping release."
                  elif [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$CURR" | sort -V | tail -n1)" != "$CURR" ]; then
                    echo "release=false" >> "$GITHUB_OUTPUT"
                    echo "v$CURR is older than the latest release v$LATEST, skipping release."
                  else
                    echo "release=true" >> "$GITHUB_OUTPUT"
                    echo "v$CURR is not released yet (latest: v${LATEST:-none}), will release."
                  fi

    # The web UI as a signed bundle, so desktop apps update it without a
    # reinstall (electron/bundleUpdater.cjs). Repository secret
    # ZAM_BUNDLE_SIGNING_KEY = the private key from scripts/gen-bundle-key.mjs
    # (its public half is electron/bundleKey.cjs). Without the secret no bundle
    # is made and the release is installers only, which every app still takes.
    bundle:
        needs: [check, verify]
        runs-on: ubuntu-latest
        env:
            ZAM_BUNDLE_SIGNING_KEY: ${{ secrets.ZAM_BUNDLE_SIGNING_KEY }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
              env:
                  VITE_PUSH_GATEWAY_URL: ${{ vars.PUSH_GATEWAY_URL }}
                  VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
            - run: node scripts/build-bundle.mjs
            - uses: actions/upload-artifact@v4
              with:
                  name: web-bundle
                  path: dist-bundle/*
                  if-no-files-found: ignore

    # Code gate: types, tests and formatting. The build jobs wait on it, so a
    # red gate never produces installers or a release.
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run test
            - run: npm run lint

    # Dev builds — run on every master push. Attached to a release only when
    # the version is unreleased (gated `release` job below).
    android:
        needs: [check, verify]
        runs-on: ubuntu-latest
        # Signing key + passwords. Add these as repository secrets:
        #   ANDROID_KEYSTORE_BASE64  = base64 of your .jks/.keystore file
        #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        # When ANDROID_KEYSTORE_BASE64 is unset the APK is built unsigned.
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
              env:
                  VITE_PUSH_GATEWAY_URL: ${{ vars.PUSH_GATEWAY_URL }}
                  VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - uses: android-actions/setup-android@v3
              with:
                  # The action's default also installs the legacy "tools" package,
                  # which current cmdline-tools no longer ship (sdkmanager exits 1).
                  # Gradle fetches the platform / build-tools it needs on its own.
                  packages: platform-tools
            - name: Add google-services.json
              if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
              env:
                  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
              run: |
                  echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            # The shell's fingerprint, packed into the APK so it only accepts web
            # bundles built for it (scripts/shell-hash-lib.mjs). From committed
            # sources, before cap sync rewrites anything.
            - name: Fingerprint the Android shell
              run: node scripts/gen-android-shell-hash.mjs
            - run: npx cap sync android
            - name: Decode signing keystore
              if: env.ANDROID_KEYSTORE_BASE64 != ''
              run: |
                  echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
                  echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            - name: Build release APK
              working-directory: android
              run: |
                  chmod +x ./gradlew
                  ./gradlew assembleRelease --no-daemon --stacktrace
            - name: Verify APK signature
              run: |
                  set -euo pipefail
                  # Both lookups are written so the friendly "not found" branches below
                  # stay REACHABLE under `set -euo pipefail`:
                  #   * the directory guards keep a missing directory from making find
                  #     exit non-zero, which would kill the step before the branch runs;
                  #   * `-print -quit` lets find itself stop at the first APK, so there
                  #     is no `| head` to close the pipe early and abort with SIGPIPE
                  #     (141) on a build that ever produces more than one APK.
                  # `tail -n1` reads its whole input, so that pipeline has no early-exit
                  # stage and is safe to keep as-is.
                  APK_DIR=android/app/build/outputs/apk/release
                  APK=""
                  if [ -d "$APK_DIR" ]; then
                    APK=$(find "$APK_DIR" -name '*.apk' -print -quit)
                  fi
                  if [ -z "$APK" ]; then
                    echo "::error::No release APK was produced."
                    exit 1
                  fi
                  BUILD_TOOLS="${ANDROID_SDK_ROOT:-}/build-tools"
                  APKSIGNER=""
                  if [ -d "$BUILD_TOOLS" ]; then
                    APKSIGNER=$(find "$BUILD_TOOLS" -name apksigner | sort | tail -n1)
                  fi
                  if [ -z "$APKSIGNER" ]; then
                    echo "::error::apksigner not found in $BUILD_TOOLS."
                    exit 1
                  fi
                  # Hard failure by design: in-app updates pin the signer certificate,
                  # so an unsigned or unverifiable APK must never reach a release.
                  # Set the ANDROID_KEYSTORE_* repository secrets to sign the build.
                  "$APKSIGNER" verify --print-certs "$APK"
            - name: Stage APK with version
              run: |
                  mkdir -p release-files
                  APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
                  cp "$APK" "release-files/zam-${{ needs.check.outputs.version }}.apk"
            - uses: actions/upload-artifact@v4
              with:
                  name: android
                  path: release-files/*.apk
                  if-no-files-found: error

    desktop:
        needs: [check, verify]
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
              env:
                  VITE_PUSH_GATEWAY_URL: ${{ vars.PUSH_GATEWAY_URL }}
                  VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
            # Windows: the per-application screen-share audio helper
            # (native/app-audio), packed by build.win.extraResources. A no-op
            # on the other runners.
            - name: Build app audio helper
              run: npm run build:app-audio
            # macOS: the MediaRemote now-playing adapter
            # (native/mediaremote-adapter), packed by build.mac.extraResources.
            # A no-op on the other runners.
            - name: Build MediaRemote adapter
              run: npm run build:mediaremote
            # The shell's fingerprint, packed into the app so it only accepts
            # web bundles built for it (scripts/shell-hash-lib.mjs).
            - name: Fingerprint the desktop shell
              run: node scripts/gen-shell-hash.mjs
            - name: Build desktop app
              run: npx electron-builder --publish never
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-${{ matrix.os }}
                  if-no-files-found: ignore
                  path: |
                      dist-electron/*.exe
                      dist-electron/*.dmg
                      dist-electron/*.zip
                      dist-electron/*.AppImage
                      dist-electron/*.deb
                      dist-electron/latest*.yml
                      dist-electron/*.blockmap

    # Flatpak: our own signed repo (served from GitHub Pages by the `pages` job
    # below), not Flathub. Built on every master push like the other desktop
    # builds; the repo is only published when the version is unreleased.
    #
    # Repository secret FLATPAK_GPG_PRIVATE_KEY = base64 of the armour-less
    # secret key whose public half is flatpak/zam-repo.gpg. Unsigned builds are
    # fine for a dev artifact, but a release refuses to publish without it.
    flatpak:
        needs: [check, verify]
        runs-on: ubuntu-latest
        env:
            FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
            VERSION: ${{ needs.check.outputs.version }}
            RELEASE: ${{ needs.check.outputs.release }}
            APP_ID: moe.crafty.matrix
            # Releases back that get a direct delta to the head.
            DELTA_RELEASES: 12
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
              env:
                  VITE_PUSH_GATEWAY_URL: ${{ vars.PUSH_GATEWAY_URL }}
                  VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
            - name: Fingerprint the desktop shell
              run: node scripts/gen-shell-hash.mjs
            - name: Build unpacked Linux app
              run: npx electron-builder --linux dir --publish never
            - name: Install Flatpak tooling
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder ostree
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            - name: Import signing key
              if: env.FLATPAK_GPG_PRIVATE_KEY != ''
              run: |
                  set -euo pipefail
                  export GNUPGHOME="$RUNNER_TEMP/gnupg"
                  mkdir -m 700 "$GNUPGHOME"
                  echo "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
                  KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
                  # The committed public key must match, or clients would reject
                  # every update signed with this one.
                  gpg --show-keys --with-colons flatpak/zam-repo.gpg | grep -q "$KEY" \
                    || { echo "::error::FLATPAK_GPG_PRIVATE_KEY does not match flatpak/zam-repo.gpg"; exit 1; }
                  echo "GPG_ARGS=--gpg-sign=$KEY --gpg-homedir=$GNUPGHOME" >> "$GITHUB_ENV"
            - name: Require signing for releases
              if: env.RELEASE == 'true' && env.FLATPAK_GPG_PRIVATE_KEY == ''
              run: |
                  echo "::error::Set the FLATPAK_GPG_PRIVATE_KEY secret to publish the Flatpak repo."
                  exit 1
            - name: Stamp version into metainfo
              run: |
                  sed -i "s/@VERSION@/$VERSION/g; s/@DATE@/$(date -u +%F)/g" \
                    flatpak/$APP_ID.metainfo.xml
            - name: Fetch the published repo's history
              if: env.RELEASE == 'true'
              run: |
                  set -euo pipefail
                  # Each release is a new commit on top of the ones already
                  # published, so `flatpak update --commit=<hash>` can roll
                  # back to any earlier release. Starting from an empty repo
                  # would publish only this version and drop every other one.
                  BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
                  sudo apt-get install -y ostree
                  ostree --repo=repo init --mode=archive
                  ostree --repo=repo remote add --no-gpg-verify previous "$BASE/repo/"
                  # The first release has nothing to fetch.
                  ostree --repo=repo pull --mirror --depth=-1 previous                     || echo "::warning::No published repo to carry history from"
                  ostree --repo=repo remote delete previous
            - name: Build Flatpak repo
              run: |
                  set -euo pipefail
                  flatpak-builder --user --install-deps-from=flathub \
                    --disable-rofiles-fuse --force-clean \
                    --default-branch=stable --repo=repo ${GPG_ARGS:-} \
                    build-dir flatpak/$APP_ID.yml
                  flatpak build-update-repo --title=Zam --default-branch=stable \
                    --generate-static-deltas --prune --prune-depth=-1 ${GPG_ARGS:-} repo
                  # `--generate-static-deltas` only covers the newest parent
                  # (and from-scratch). OSTree never chains deltas: a client
                  # gets one only if it goes straight from its installed
                  # commit to the head, so anyone more than one release behind
                  # falls back to fetching changed objects. Add a delta from
                  # each of the previous releases (2..12 back) to the head.
                  REF=app/$APP_ID/x86_64/stable
                  HEAD_REV=$(ostree --repo=repo rev-parse "$REF")
                  FROMS=""
                  for N in $(seq 2 $DELTA_RELEASES); do
                    FROM=$(ostree --repo=repo rev-parse "$REF~$N" 2>/dev/null) || break
                    FROMS="$FROMS $FROM"
                  done
                  # Each delta is independent, so run them across the runner's
                  # cores. xargs exits non-zero if any one fails.
                  printf '%s\n' $FROMS | xargs -r -P "$(nproc)" -I{} \
                    ostree --repo=repo static-delta generate --from={} --to="$HEAD_REV" "$REF"
                  # Re-index so the summary lists the new deltas, and re-sign it.
                  flatpak build-update-repo --title=Zam --default-branch=stable \
                    --prune --prune-depth=-1 ${GPG_ARGS:-} repo
            - name: Build Flatpak bundle
              run: |
                  set -euo pipefail
                  # Owner/repo of the Pages site that hosts the repo; a bundle
                  # carrying this URL + key keeps updating from it after install.
                  BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
                  echo "PAGES_BASE=$BASE" >> "$GITHUB_ENV"
                  REMOTE_ARGS=""
                  if [ -n "${GPG_ARGS:-}" ]; then
                    REMOTE_ARGS="--repo-url=$BASE/repo/ --gpg-keys=flatpak/zam-repo.gpg"
                  fi
                  mkdir -p release-files
                  flatpak build-bundle $REMOTE_ARGS \
                    --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
                    repo "release-files/zam-$VERSION.flatpak" $APP_ID stable
            - uses: actions/upload-artifact@v4
              with:
                  name: flatpak
                  path: release-files/*.flatpak
                  if-no-files-found: error
            - name: Assemble Pages site
              if: env.RELEASE == 'true'
              run: |
                  set -euo pipefail
                  KEY_B64=$(base64 -w0 flatpak/zam-repo.gpg)
                  mkdir site
                  mv repo site/repo
                  cp electron/icons/icon.png site/icon.png
                  cat > site/zam.flatpakrepo <<EOF
                  [Flatpak Repo]
                  Title=Zam
                  Url=$PAGES_BASE/repo/
                  Homepage=https://github.com/$GITHUB_REPOSITORY
                  Comment=Zam Matrix client
                  Icon=$PAGES_BASE/icon.png
                  GPGKey=$KEY_B64
                  EOF
                  cat > site/zam.flatpakref <<EOF
                  [Flatpak Ref]
                  Name=$APP_ID
                  Branch=stable
                  Title=Zam
                  Url=$PAGES_BASE/repo/
                  SuggestRemoteName=zam
                  RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
                  IsRuntime=false
                  Homepage=https://github.com/$GITHUB_REPOSITORY
                  Icon=$PAGES_BASE/icon.png
                  GPGKey=$KEY_B64
                  EOF
                  sed "s|@BASE@|$PAGES_BASE|g; s|@VERSION@|$VERSION|g" \
                    flatpak/index.html > site/index.html
                  # The version the repo holds. The app's Flatpak updater reads
                  # it to tell "not published yet" from "already installed, only
                  # a restart is missing" (electron/flatpakShellUpdate.cjs).
                  printf '{"version":"%s"}\n' "$VERSION" > site/version.json
            # Published by the `pages` job, merged with the F-Droid repo.
            - uses: actions/upload-artifact@v4
              if: env.RELEASE == 'true'
              with:
                  name: pages-flatpak
                  path: site

    # F-Droid: our own repo (served from GitHub Pages by the `pages` job, under
    # /fdroid/repo), indexing the release APKs. The index is signed with the
    # Android APK signing key (the ANDROID_KEYSTORE_* secrets), so clients pin
    # that key. Without them the job is skipped and the release carries on.
    fdroid:
        needs: [check, android]
        if: needs.check.outputs.release == 'true'
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.key.outputs.present }}
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
            VERSION: ${{ needs.check.outputs.version }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Check for the repo key
              id: key
              run: |
                  if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
                    echo "::warning::ANDROID_KEYSTORE_* secrets are not set; skipping the F-Droid repo."
                    echo "present=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "present=true" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/checkout@v4
              if: steps.key.outputs.present == 'true'
            - uses: actions/download-artifact@v4
              if: steps.key.outputs.present == 'true'
              with:
                  name: android
                  path: apk
            - name: Build the F-Droid repo
              if: steps.key.outputs.present == 'true'
              run: |
                  set -euo pipefail
                  BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
                  mkdir -p work/repo work/metadata/moe.crafty.matrix/en-US
                  cp fdroid/metadata/*.yml work/metadata/
                  cp electron/icons/icon.png work/metadata/moe.crafty.matrix/en-US/icon.png
                  sed "s|@BASE@|$BASE|g; s|@ALIAS@|$ANDROID_KEY_ALIAS|g"                     fdroid/config.yml > work/config.yml
                  echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > work/keystore.jks
                  # fdroidserver takes the passwords only from config.yml. jq
                  # quotes them as JSON strings, which YAML reads as written.
                  {
                    echo "keystorepass: $(jq -Rn --arg v "$ANDROID_KEYSTORE_PASSWORD" '$v')"
                    echo "keypass: $(jq -Rn --arg v "$ANDROID_KEY_PASSWORD" '$v')"
                  } >> work/config.yml
                  chmod 600 work/config.yml
                  # Earlier releases stay installable (and downgradable) from the
                  # repo: bring the last few APKs along with the new one.
                  for tag in $(gh release list --limit 5 --json tagName --jq '.[].tagName'); do
                    gh release download "$tag" --pattern '*.apk' --dir work/repo --skip-existing || true
                  done
                  cp apk/*.apk work/repo/
                  pip install fdroidserver androguard
                  cd work
                  fdroid update --create-metadata --verbose
                  # What clients pin when adding the repo by hand.
                  FP=$(keytool -list -keystore keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD"                     -alias "$ANDROID_KEY_ALIAS" | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -n1 | tr -d ':')
                  [ -n "$FP" ] || FP=$(unzip -p repo/index-v1.jar 'META-INF/*.RSA'                     | openssl pkcs7 -inform DER -print_certs | openssl x509 -fingerprint -sha256 -noout                     | cut -d= -f2 | tr -d ':')
                  cd ..
                  mkdir -p site-fdroid/fdroid
                  mv work/repo site-fdroid/fdroid/repo
                  sed "s|@BASE@|$BASE|g; s|@HOSTPATH@|${BASE#https://}|g; s|@VERSION@|$VERSION|g; s|@FINGERPRINT@|$FP|g"                     fdroid/index.html > site-fdroid/fdroid/index.html
            - uses: actions/upload-artifact@v4
              if: steps.key.outputs.present == 'true'
              with:
                  name: pages-fdroid
                  path: site-fdroid

    release:
        # fdroid is only waited for, to know whether to link its repo; a failed
        # F-Droid build must not stop the release, so every other job is checked
        # by hand (a plain needs would skip the release when any of them fail).
        needs: [check, android, desktop, flatpak, bundle, fdroid]
        if: >-
            !cancelled() && needs.check.outputs.release == 'true' &&
            needs.android.result == 'success' && needs.desktop.result == 'success' &&
            needs.flatpak.result == 'success' && needs.bundle.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Extract the changelog section for this version
              shell: bash
              run: |
                  VER="${{ needs.check.outputs.version }}"
                  # Pull the "## v<version>" section out of CHANGELOG.md into the release
                  # body (stops at the next "## " heading). Empty if there is no matching
                  # entry — the auto-generated commit notes below still fill the release.
                  awk -v h="## v$VER" \
                    'index($0,h)==1 && substr($0,length(h)+1,1) !~ /[0-9]/ {f=1;next} /^## /{f=0} f{print}' \
                    CHANGELOG.md > "$RUNNER_TEMP/release-body.md" || true
                  echo "----- release body for v$VER -----"
                  cat "$RUNNER_TEMP/release-body.md"
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  # Not the github-pages artifact (the Flatpak repo tarball).
                  pattern: "{android,desktop-*,flatpak,web-bundle}"
            # A friendly platform table placed above the changelog, so nobody
            # has to pick through the update manifests (latest*.yml), blockmaps
            # and web bundles. Files are found by pattern because electron-builder
            # adds an arch suffix on some platforms; a platform whose file is
            # missing is left out rather than linked dead.
            - name: Build the download table
              shell: bash
              env:
                  FDROID_PUBLISHED: ${{ needs.fdroid.result == 'success' && needs.fdroid.outputs.published == 'true' }}
              run: |
                  set -euo pipefail
                  VER="${{ needs.check.outputs.version }}"
                  BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VER"
                  PAGES="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
                  link() { # label, glob under artifacts/
                    local f
                    f=$(find artifacts -type f -name "$2" | sort | head -n1)
                    [ -n "$f" ] && printf '[%s](%s/%s)' "$1" "$BASE" "$(basename "$f")" || true
                  }
                  join() { # joins the non-empty arguments with " · "
                    local out="" a
                    for a in "$@"; do
                      [ -z "$a" ] && continue
                      out="${out:+$out · }$a"
                    done
                    printf '%s' "$out"
                  }
                  {
                    echo "## Download Zam"
                    echo
                    echo "| Platform | Download |"
                    echo "| --- | --- |"
                    echo "| 🐧 **Linux** | $(join "[**Flatpak**]($PAGES/zam.flatpakref)" "$(link 'AppImage' '*.AppImage')" "$(link 'Flatpak bundle (offline)' '*.flatpak')") |"
                    echo "| 🪟 **Windows** | $(join "$(link "**Installer**" '*Setup*.exe')" "$(link 'Portable' '*Portable*.exe')") |"
                    echo "| 🍎 **macOS** | $(join "$(link "**DMG**" '*.dmg')") |"
                    echo "| 🤖 **Android** | $(join "$(link "**APK**" '*.apk')" "$([ "$FDROID_PUBLISHED" = true ] && printf '[F-Droid repository](%s/fdroid/)' "$PAGES")") |"
                    echo "| 📱 **iOS** | [**Open the web app**](https://matrix.crafty.moe) and use Share > Add to Home Screen |"
                    echo
                    echo "The other files below (\`.yml\`, \`.blockmap\`, \`.zbundle\`) are used by Zam's built-in updater. You don't need them."
                    echo
                  } > "$RUNNER_TEMP/download-table.md"
                  cat "$RUNNER_TEMP/release-body.md" >> "$RUNNER_TEMP/download-table.md"
                  mv "$RUNNER_TEMP/download-table.md" "$RUNNER_TEMP/release-body.md"
                  cat "$RUNNER_TEMP/release-body.md"
            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ needs.check.outputs.version }}
                  name: v${{ needs.check.outputs.version }}
                  body_path: ${{ runner.temp }}/release-body.md
                  generate_release_notes: true
                  fail_on_unmatched_files: false
                  files: artifacts/**/*

    # Publish the Flatpak repo to GitHub Pages, only once the release exists.
    # Needs Settings -> Pages -> Source: "GitHub Actions".
    pages:
        needs: [check, flatpak, fdroid, release]
        # A failed or skipped F-Droid build still lets the Flatpak site deploy.
        if: >-
            !cancelled() && needs.check.outputs.release == 'true' &&
            needs.flatpak.result == 'success' && needs.release.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: pages-*
                  path: parts
                  merge-multiple: true
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: parts
            - id: deploy
              uses: actions/deploy-pages@v4
