<!doctype html>
<!--
    The page FlashEmbed.svelte plays a SWF in, inside an iframe with
    sandbox="allow-scripts" and no allow-same-origin: an opaque origin, so
    nothing here can reach the app's storage, cookies, DOM or navigation,
    whatever a SWF manages to run. This CSP also takes away the network; the
    app hands over the SWF and Ruffle's wasm (frame.js).
-->
<meta charset="utf-8" />
<meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
/>
<style>
    html,
    body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
</style>
<script src="/flash-sandbox/frame.js"></script>
